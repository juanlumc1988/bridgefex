# What C++ keeps a pointer to, and the header does not say.

# A class that others derive from: the call of its implementation from an override keeps too.
directors = ["keep_Pen"]

# The object itself: the Latch that the method returns keeps a pointer to its Gate...
[keep_Gate_latch]
this = "retain"

# ...or the library keeps it for ever (there is no object to tie it to).
[keep_Gate_pin]
this = "retain"

# A text that is stored, not copied: a const char* and a std::string_view.
[keep_Label_create_cstr]
title = "retain"

[keep_Label_setRaw]
text = "retain"

[keep_Label_setView]
text = "retain"

[keep_Label_setMaybe]
text = ["retain", "nullable"]

# Without an object, for ever.
[keep_Label_keepView]
text = "retain"

[keep_Label_create_string_view]
title = "retain"

# Stores the text, then throws: it is kept before the call.
[keep_Label_setRawThrow]
text = "retain"

[keep_Pen_stamp]
this = "retain"

[keep_Pen_note]
text = "retain"

[keep_Pen_noteView]
text = "retain"
