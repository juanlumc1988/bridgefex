# SPDX-License-Identifier: Apache-2.0
# What every backend must do when a class of its language overrides virtual methods of C++
# (see tests/conformance/scenarios.py). An override is named as the member of the vtable
# of the C API; the calls go through C++, which is what runs the overrides.

[[scenario]]
name = "C++ runs the overrides of a class of the language"
steps = [
  { derive = "shape.Shape", named = "Square", overrides = { area = { returns = 4.0 }, name = { returns = "sq" }, quiet = { returns = 9 } } },
  { new = "Square", overload = "_void", as = "s" },
  { call = "s.describe", expect = "sq: 4 units" },
  { call = "s.how_quiet", expect = 9 },
  { call = "s.fixed", expect = 7 },
]

[[scenario]]
name = "a method that is not overridden keeps the implementation of the class"
steps = [
  { derive = "shape.Shape", named = "Labelled", overrides = { area = { returns = 1.0 } } },
  { new = "Labelled", overload = "_string_int32", args = ["box", 3], as = "l" },
  { call = "l.describe", expect = "box: 1 units" },
  { call = "l.sides", expect = 3 },
  { call = "l.label", expect = "box" },
]

[[scenario]]
name = "an override can run the implementation of its base class"
steps = [
  { derive = "shape.Shape", named = "Boxed", overrides = { area = { returns = 1.0 }, name = { base = true } } },
  { new = "Boxed", overload = "_string_int32", args = ["box", 3], as = "b" },
  { call = "b.describe", expect = "box: 1 units" },
  { call = "b.welcome", args = ["Ann"], expect = ">> hello Ann, I am box" },
]

[[scenario]]
name = "enums, structs and strings cross in both directions"
steps = [
  { derive = "shape.Shape", named = "Typed", overrides = { area = { returns = 2.0 }, center = { returns = { struct = "shape.Point", x = 4.0, y = 6.0 } }, mode = { argument = 0 }, greet = { argument = 0 }, add_int32_int32 = { returns = 99 }, add_double_double = { argument = 1 }, move = { argument = 1 } } },
  { new = "Typed", overload = "_void", as = "t" },
  { call = "t.middle", args = [{ struct = "shape.Point", x = 2.0, y = 0.0 }], expect = { struct = "shape.Point", x = 3.0, y = 3.0 } },
  { call = "t.choose", args = [{ enum = "shape.Mode", member = "Auto" }], expect = { enum = "shape.Mode", member = "Auto" } },
  { call = "t.choose", args = [{ enum = "shape.Mode", member = "On" }], expect = { enum = "shape.Mode", member = "On" } },
  { call = "t.welcome", args = ["Ann"], expect = "Ann" },
  { call = "t.sum", args = [1, 2], expect = 99 },
  { call = "t.sum_double", args = [2.5, 1.0], expect = 1.0 },
  { call = "t.call_move", args = [{ struct = "shape.Point", x = 1.0, y = 1.0 }], expect = { struct = "shape.Point", x = 4.0, y = 6.0 } },
]

[[scenario]]
name = "a struct crosses by value"
steps = [
  { derive = "shape.Shape", named = "Mover", overrides = { area = { returns = 1.0 }, move = { argument = 0 } } },
  { new = "Mover", overload = "_void", as = "m" },
  { call = "m.call_move", args = [{ struct = "shape.Point", x = 1.0, y = 2.0 }], expect = { struct = "shape.Point", x = 1.0, y = 2.0 } },
]

[[scenario]]
name = "the failure of an override reaches the call that made C++ run it"
steps = [
  { derive = "shape.Shape", named = "Failing", overrides = { area = { raises = "boom" } } },
  { new = "Failing", overload = "_void", as = "f" },
  { call = "f.describe", error = "override", message = "boom" },
  { call = "f.sum", args = [1, 2], expect = 3 },
  { call = "f.describe", error = "override", message = "boom" },
]

[[scenario]]
name = "a protected virtual method is overridden too, and C++ calls it"
steps = [
  { derive = "shape.Shape", named = "Noisy", overrides = { area = { returns = 1.0 }, changed = { raises = "changed" }, scale = { raises = "scaled" } } },
  { new = "Noisy", overload = "_void", as = "n" },
  { call = "n.notify", args = [5], error = "override", message = "changed" },
  { call = "n.scaled_area", args = [2.0], error = "override", message = "scaled" },
  { derive = "shape.Shape", named = "Quiet", overrides = { area = { returns = 1.0 }, changed = { base = true } } },
  { new = "Quiet", overload = "_void", as = "q" },
  { call = "q.notify", args = [5] },
  { call = "q.last_reason", expect = 5 },
]

[[scenario]]
name = "a class whose constructors are protected is made by a derived class"
steps = [
  { derive = "stage.Stage", named = "Steps", overrides = { step = { returns = "s" }, origin = { returns = { struct = "shape.Point", x = 7.0, y = 0.0 } } } },
  { new = "Steps", overload = "_int32", args = [3], as = "steps" },
  { call = "steps.run", args = [{ enum = "shape.Mode", member = "On" }], expect = "sss@7" },
  { call = "steps.steps", expect = 3 },
  { new = "Steps", overload = "_void", as = "default" },
  { call = "default.run", args = [{ enum = "shape.Mode", member = "Auto" }], expect = "ss@7" },
]

[[scenario]]
name = "a class that is not abstract can be derived from too"
steps = [
  { derive = "shape.Circle", named = "Disc", overrides = { name = { returns = "disc" } } },
  { new = "Disc", args = [1.0], as = "d" },
  { call = "d.describe", expect = "disc: 3 units" },
  { call = "d.radius", expect = 1.0 },
]

[[scenario]]
name = "a derived class that declares one overload hides the others, but its fallback is not lost"
steps = [
  { derive = "shape.Circle", named = "Hiding", overrides = { name = { returns = "hiding" }, add_double_double = { base = true }, add_int32_int32 = { returns = 5 } } },
  { new = "Hiding", args = [1.0], as = "h" },
  { call = "h.sum_double", args = [2.5, 1.0], expect = 3.5 },
  { call = "h.sum", args = [2, 1], expect = 5 },
]

[[scenario]]
name = "containers cross in both directions"
steps = [
  { derive = "shape.Shape", named = "Lists", overrides = { area = { returns = 1.0 }, total = { returns = 77 }, numbers = { returns = [10, 20] }, words = { argument = 0 }, modes = { returns = [{ enum = "shape.Mode", member = "On" }, { enum = "shape.Mode", member = "Auto" }] }, points = { argument = 0 }, flags = { argument = 0 }, triple = { returns = [3.0, 2.0, 1.0] } } },
  { new = "Lists", overload = "_void", as = "l" },
  { call = "l.call_total", args = [[1, 2, 3]], expect = 77 },
  { call = "l.call_numbers", args = [[1, 2, 3]], expect = [10, 20] },
  { call = "l.call_numbers", args = [[]], expect = [10, 20] },
  { call = "l.call_words", args = [["ab", "c\u0000d", "é"]], expect = ["ab", "c\u0000d", "é"] },
  { call = "l.call_words", args = [[]], expect = [] },
  { call = "l.call_modes", args = [[]], expect = [{ enum = "shape.Mode", member = "On" }, { enum = "shape.Mode", member = "Auto" }] },
  { call = "l.call_points", args = [[{ struct = "shape.Point", x = 1.0, y = 2.0 }, { struct = "shape.Point", x = 3.0, y = 4.0 }]], expect = [{ struct = "shape.Point", x = 1.0, y = 2.0 }, { struct = "shape.Point", x = 3.0, y = 4.0 }] },
  { call = "l.call_flags", args = [[true, false, true]], expect = [true, false, true] },
  { call = "l.call_triple", args = [[1.0, 2.0, 3.0]], expect = [3.0, 2.0, 1.0] },
]

[[scenario]]
name = "a container that is not overridden keeps the implementation of the class"
steps = [
  { derive = "shape.Shape", named = "Plain", overrides = { area = { returns = 1.0 } } },
  { new = "Plain", overload = "_void", as = "p" },
  { call = "p.call_numbers", args = [[1, 2, 3]], expect = [3, 2, 1] },
  { call = "p.call_words", args = [["a", "b"]], expect = ["a!", "b!"] },
  { call = "p.call_flags", args = [[true, false]], expect = [false, true] },
  { call = "p.call_triple", args = [[1.0, 2.0, 3.0]], expect = [2.0, 4.0, 6.0] },
  { call = "p.call_total", args = [[1, 2, 3]], expect = 6 },
]

[[scenario]]
name = "an override runs the implementation of the class with a container"
steps = [
  { derive = "shape.Shape", named = "Base", overrides = { area = { returns = 1.0 }, numbers = { base = true }, points = { base = true } } },
  { new = "Base", overload = "_void", as = "b" },
  { call = "b.call_numbers", args = [[1, 2, 3]], expect = [3, 2, 1] },
  { call = "b.call_points", args = [[{ struct = "shape.Point", x = 1.0, y = 2.0 }]], expect = [{ struct = "shape.Point", x = 2.0, y = 1.0 }] },
]

[[scenario]]
name = "the failure of an override with a container reaches the call"
steps = [
  { derive = "shape.Shape", named = "Broken", overrides = { area = { returns = 1.0 }, numbers = { raises = "no numbers" } } },
  { new = "Broken", overload = "_void", as = "k" },
  { call = "k.call_numbers", args = [[1]], error = "override", message = "no numbers" },
  { call = "k.call_total", args = [[1, 2]], expect = 3 },
]

[[scenario]]
name = "arrays and enums reach the override as they are"
steps = [
  { derive = "shape.Shape", named = "Echo", overrides = { area = { returns = 1.0 }, triple = { argument = 0 }, modes = { argument = 0 } } },
  { new = "Echo", overload = "_void", as = "e" },
  { call = "e.call_triple", args = [[1.0, 2.0, 3.0]], expect = [1.0, 2.0, 3.0] },
  { call = "e.call_triple", args = [[9.0, 8.0, 7.0]], expect = [9.0, 8.0, 7.0] },
  { call = "e.call_modes", args = [[{ enum = "shape.Mode", member = "Auto" }, { enum = "shape.Mode", member = "Off" }]], expect = [{ enum = "shape.Mode", member = "Auto" }, { enum = "shape.Mode", member = "Off" }] },
]

[[scenario]]
name = "an override uses the objects that C++ lends it, and the one that it gives it"
steps = [
  { derive = "shape.Shape", named = "Asker", overrides = { area = { returns = 2.0 }, grow = { asks = { argument = 0, call = "call_length" } }, adopt = { asks = { argument = 0, call = "call_length" } }, compare = { asks = { argument = 0, call = "area" } } } },
  { derive = "shape.Shape", named = "Square", overrides = { area = { returns = 4.0 } } },
  { new = "Asker", overload = "_void", as = "a" },
  { new = "Square", overload = "_void", as = "sq" },
  { new = "shape.Beam", args = [5], as = "b" },
  { call = "a.call_grow", args = [{ ref = "b" }], expect = 5 },
  { call = "b.call_length", expect = 5 },
  { call = "a.call_compare", args = [{ ref = "sq" }], expect = 4.0 },
  { call = "a.call_adopt", args = [{ ref = "b" }], expect = 5 },
  { call = "b.call_length", error = "closed" },
]

[[scenario]]
name = "an override gives C++ a new object, or none"
steps = [
  { derive = "shape.Shape", named = "Maker", overrides = { area = { returns = 1.0 }, make_beam = { makes = { new = "shape.Beam", args = [9] } } } },
  { derive = "shape.Shape", named = "Nobody", overrides = { area = { returns = 1.0 }, make_beam = { returns = { null = true } } } },
  { new = "Maker", overload = "_void", as = "m" },
  { new = "Nobody", overload = "_void", as = "n" },
  { call = "m.call_make_beam", args = [1], as = "made" },
  { call = "made.call_length", expect = 9 },
  { call = "n.call_make_beam", args = [1], expect = { null = true } },
]
