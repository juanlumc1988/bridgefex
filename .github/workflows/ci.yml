name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Ruff on the generated Python (pyflakes and syntax rules)
        run: ruff check --isolated --select F,E9 tests/golden/*/expected/python
      - name: Mypy
        run: mypy

  linux:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # The tests of the C# and Java bindings build them with the SDK and the JDK: without
      # them they fail, not skip.
      BRIDGEFEX_REQUIRE_DOTNET: "1"
      BRIDGEFEX_REQUIRE_JAVA: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install libclang 20 and compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libclang1-20 libclang-common-20-dev gcc-14 g++-14 clang-20
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            echo "CC=clang-20" >> "$GITHUB_ENV"
            echo "CXX=clang++-20" >> "$GITHUB_ENV"
          fi
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -ra

  windows:
    name: windows-2025 / MSVC / Python ${{ matrix.python }}
    runs-on: windows-2025
    env:
      # Python 3.12-3.14 default to the ANSI code page on Windows.
      PYTHONUTF8: "1"
      BRIDGEFEX_REQUIRE_DOTNET: "1"
      BRIDGEFEX_REQUIRE_JAVA: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # The image ships LLVM 20 in C:\Program Files\LLVM; bridgefex checks the
      # version of the libclang.dll it loads.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -ra

  # The oldest Java that the Java bindings support (the foreign function API is final in 22): the
  # tests of the backend, its round trips and the conformance suite.
  java22:
    name: ubuntu-24.04 / Java 22
    runs-on: ubuntu-24.04
    env:
      BRIDGEFEX_REQUIRE_JAVA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - name: Install libclang 20 and compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libclang1-20 libclang-common-20-dev gcc-14 g++-14
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        env:
          CC: gcc-14
          CXX: g++-14
        run: python -m pytest -ra tests/test_jvm_backend.py tests/test_jni_backend.py tests/test_jvm_roundtrip.py tests/test_conformance.py -k "jvm or jni or java"

  # The JNI bindings are Java 8: their checks run on the JDKs that 32-bit ARM, embedded Linux and
  # Android have (8, 11 and 17), compiled for Java 8 by a newer JDK. The conformance scenarios run
  # on the 17.
  jni-old-javas:
    name: ubuntu-24.04 / JNI on Java 8, 11 and 17
    runs-on: ubuntu-24.04
    env:
      BRIDGEFEX_REQUIRE_JAVA: "1"
      BRIDGEFEX_REQUIRE_OLD_JAVA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Each of these sets JAVA_HOME_<n>_X64, which the tests look for; the last one compiles.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install libclang 20 and compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libclang1-20 libclang-common-20-dev gcc-14 g++-14
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        env:
          CC: gcc-14
          CXX: g++-14
        run: python -m pytest -ra tests/test_jni_other_javas.py
