name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Ruff on the generated Python (pyflakes and syntax rules)
        run: ruff check --isolated --select F,E9 tests/golden/*/expected/python
      - name: Mypy
        run: mypy

  linux:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install libclang 20 and compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libclang1-20 libclang-common-20-dev gcc-14 g++-14 clang-20
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            echo "CC=clang-20" >> "$GITHUB_ENV"
            echo "CXX=clang++-20" >> "$GITHUB_ENV"
          fi
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -ra

  windows:
    name: windows-2025 / MSVC / Python ${{ matrix.python }}
    runs-on: windows-2025
    env:
      # Python 3.12-3.14 default to the ANSI code page on Windows.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The image ships LLVM 20 in C:\Program Files\LLVM; bridgefex checks the
      # version of the libclang.dll it loads.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -ra
