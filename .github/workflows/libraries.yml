name: Libraries

# The C library that bridgefex generates for the demo example, built for every target and
# run there (scripts/build_libraries.py): Linux x86_64, Linux aarch64, Linux armhf (32-bit
# ARM, cross-compiled and run under QEMU; its C# bindings are compiled, not run) and Windows
# x64 (MSVC). The C programs of the director examples (classes of C that override C++ virtual
# methods) are built and run there too, and nothing is packaged if one fails.
#
# A tag v* makes a release with the libraries, and the README links to the files of the
# latest one (their names do not change). A push to main, a pull request that changes this
# workflow, the script or the glue of the JNI bindings, and a manual run build and run the
# libraries and keep them as artifacts of the run only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/libraries.yml
      - scripts/build_libraries.py
      # The glue of the JNI bindings is compiled for every target here.
      - src/bridgefex/backends/jvm/jni.py
      - src/bridgefex/backends/jvm/templates/jni/glue.cpp.j2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: linux-armhf
            os: ubuntu-24.04
          - target: windows-x64
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The C# bindings are compiled for 32-bit ARM, and the C# checks of the containers, spans and
      # callbacks are published for it (self-contained) and run under QEMU: a few seconds each.
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'linux-armhf'
        with:
          dotnet-version: "8.0.x"
      - name: Install libclang 20 and the compilers
        if: runner.os == 'Linux'
        run: |
          packages="libclang1-20 libclang-common-20-dev gcc-14 g++-14"
          if [ "${{ matrix.target }}" = linux-armhf ]; then
            packages="$packages gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf qemu-user"
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $packages
      # The image ships LLVM 20 in C:\Program Files\LLVM; bridgefex checks the version of
      # the libclang.dll it loads.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install
        run: python -m pip install -e .
      - name: Build and run the libraries
        if: matrix.target == 'linux-x86_64' || matrix.target == 'linux-aarch64'
        env:
          CC: gcc-14
          CXX: g++-14
        run: python scripts/build_libraries.py --target ${{ matrix.target }} --output dist --jni-glue --check-case directors --check-case directors11
      # The headers are parsed as the cross compiler sees them: its target and sysroot.
      - name: Build and run the libraries (32-bit ARM)
        if: matrix.target == 'linux-armhf'
        run: |
          python scripts/build_libraries.py --target linux-armhf --output dist \
            --cc arm-linux-gnueabihf-gcc-14 --cxx arm-linux-gnueabihf-g++-14 \
            --ar arm-linux-gnueabihf-ar --clang-target armv7a-linux-gnueabihf \
            --runner "qemu-arm -L /usr/arm-linux-gnueabihf" \
            --jni-glue \
            --csharp-runtime linux-arm --csharp-trim \
            --csharp-check containers --csharp-check spans --csharp-check callbacks --csharp-check directors \
            --csharp-check callbacks_edge --csharp-check directors_containers --csharp-check directors_objects \
            --check-case directors --check-case directors11
      - name: Build and run the libraries (Windows)
        if: matrix.target == 'windows-x64'
        run: python scripts/build_libraries.py --target windows-x64 --output dist --jni-glue --check-case directors --check-case directors11
      - uses: actions/upload-artifact@v4
        with:
          name: libraries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libraries-*
          merge-multiple: true
          path: dist
      - name: Release
        # A release that was written by hand for the tag keeps its text: only the files are added.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
