name: Libraries

# The C library that bridgefex generates for the demo example, built for every target and
# run there (scripts/build_libraries.py): Linux x86_64, Linux aarch64, Linux armhf (32-bit
# ARM, cross-compiled and run under QEMU) and Windows x64 (MSVC). The C programs of the
# director examples (classes of C that override C++ virtual methods) are built and run there
# too, and nothing is packaged if one fails.
#
# A push to main replaces the "nightly" pre-release, a tag v* makes a release, and the
# README links to their files. On pull requests that change this workflow or the script,
# and on manual runs of other branches, the libraries are built and kept as artifacts of
# the run only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/libraries.yml
      - scripts/build_libraries.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: linux-armhf
            os: ubuntu-24.04
          - target: windows-x64
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install libclang 20 and the compilers
        if: runner.os == 'Linux'
        run: |
          packages="libclang1-20 libclang-common-20-dev gcc-14 g++-14"
          if [ "${{ matrix.target }}" = linux-armhf ]; then
            packages="$packages gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf qemu-user"
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $packages
      # The image ships LLVM 20 in C:\Program Files\LLVM; bridgefex checks the version of
      # the libclang.dll it loads.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install
        run: python -m pip install -e .
      - name: Build and run the libraries
        if: matrix.target == 'linux-x86_64' || matrix.target == 'linux-aarch64'
        env:
          CC: gcc-14
          CXX: g++-14
        run: python scripts/build_libraries.py --target ${{ matrix.target }} --output dist --check-case directors --check-case directors11
      # The headers are parsed as the cross compiler sees them: its target and sysroot.
      - name: Build and run the libraries (32-bit ARM)
        if: matrix.target == 'linux-armhf'
        run: |
          python scripts/build_libraries.py --target linux-armhf --output dist \
            --cc arm-linux-gnueabihf-gcc-14 --cxx arm-linux-gnueabihf-g++-14 \
            --ar arm-linux-gnueabihf-ar --clang-target armv7a-linux-gnueabihf \
            --runner "qemu-arm -L /usr/arm-linux-gnueabihf" \
            --check-case directors --check-case directors11
      - name: Build and run the libraries (Windows)
        if: matrix.target == 'windows-x64'
        run: python scripts/build_libraries.py --target windows-x64 --output dist --check-case directors --check-case directors11
      - uses: actions/upload-artifact@v4
        with:
          name: libraries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libraries-*
          merge-multiple: true
          path: dist
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME"
      # A release that is replaced, with its tag, so that its files are those of the last
      # commit of main. The file names do not change, so the links in the README do not.
      - name: Nightly
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "The libraries that bridgefex generated for the demo example from the last commit of main ($GITHUB_SHA). Replaced by every push."
